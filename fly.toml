app = "raadstracker"
primary_region = "ams"

[build]

[env]
DB_PATH = "/data/tracker.db"

[mounts]
source = "raadstracker_data"
destination = "/data"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[vm]]
memory = "512mb"
cpu_kind = "shared"
cpus = 1
