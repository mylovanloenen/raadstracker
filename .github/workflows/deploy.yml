name: Deploy & dagelijkse update

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy naar Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Installeer flyctl
        run: curl -L https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - name: Deploy naar Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # De dagelijkse update + briefing wordt door de app zelf gepland (07:50 Amsterdam-tijd,
  # zie app.py). Deze job is alleen voor een handmatige extra run.
  dagelijkse-update:
    name: Handmatige data-update + briefing
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Dagelijkse update + briefing
        run: |
          curl -s -X POST https://raadstracker.fly.dev/api/dagelijks \
            -d "token=${{ secrets.SCRAPE_TOKEN }}" \
            -H "Content-Type: application/x-www-form-urlencoded"
