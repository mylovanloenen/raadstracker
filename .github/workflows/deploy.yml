name: Deploy & dagelijkse update

on:
  push:
    branches: [main]
  schedule:
    # Dagelijks om 06:00 UTC (= 07:00 CET / 08:00 CEST)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy naar Fly.io
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Installeer flyctl
        run: curl -L https://fly.io/install.sh | sh && echo "$HOME/.fly/bin" >> $GITHUB_PATH
      - name: Deploy naar Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  dagelijkse-update:
    name: Dagelijkse data-update + briefing
    runs-on: ubuntu-latest
    needs: deploy
    # Wacht altijd op de deploy-job (die wordt overgeslagen bij een schedule-run),
    # zodat een deploy nooit een lopende update afbreekt.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      actions: write
      contents: write
    steps:
      - name: Houd workflow actief (GitHub zet cron uit na 60 dagen zonder commits)
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dagelijkse update + briefing
        run: |
          curl -s -X POST https://raadstracker.fly.dev/api/dagelijks \
            -d "token=${{ secrets.SCRAPE_TOKEN }}" \
            -H "Content-Type: application/x-www-form-urlencoded"
