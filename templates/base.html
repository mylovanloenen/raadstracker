<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Raadstracker{% endblock %} — Amsterdam</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <meta name="theme-color" content="#003082">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Raadstracker">
</head>
<body class="app-pagina">

<div class="app-layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="/" class="sidebar-logo">
        <div class="sidebar-logo-icon">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M4 11h14M11 4v14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        Raadstracker
      </a>
    </div>

    <nav class="sidebar-nav">
      <a href="/nieuws" class="sidebar-link {% if request.url.path == '/nieuws' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 5v3.5l2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Nieuws vandaag
      </a>
      <a href="/" class="sidebar-link {% if request.url.path == '/' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="2" width="5" height="5" rx="1.2" fill="currentColor"/>
          <rect x="9" y="2" width="5" height="5" rx="1.2" fill="currentColor"/>
          <rect x="2" y="9" width="5" height="5" rx="1.2" fill="currentColor"/>
          <rect x="9" y="9" width="5" height="5" rx="1.2" fill="currentColor"/>
        </svg>
        Archief
      </a>
      <a href="/briefing" class="sidebar-link {% if request.url.path == '/briefing' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 4h10M3 8h7M3 12h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Briefing
      </a>
      <a href="/toezeggingen" class="sidebar-link {% if request.url.path == '/toezeggingen' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8l3 3 7-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Toezeggingen
      </a>
      <a href="/agenda" class="sidebar-link {% if request.url.path == '/agenda' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 2v2M11 2v2M2 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        Agenda
      </a>
      <a href="/fracties" class="sidebar-link {% if request.url.path == '/fracties' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M2 13c0-2.2 1.8-4 4-4s4 1.8 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M11 7c1.1 0 2 .9 2 2v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="12" cy="4.5" r="1.5" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Fracties
      </a>
      <a href="/statistieken" class="sidebar-link {% if request.url.path == '/statistieken' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="2" y="9" width="3" height="5" rx="1" fill="currentColor" opacity=".5"/>
          <rect x="6.5" y="5" width="3" height="9" rx="1" fill="currentColor" opacity=".7"/>
          <rect x="11" y="2" width="3" height="12" rx="1" fill="currentColor"/>
        </svg>
        Statistieken
      </a>
      <a href="/chat" class="sidebar-link {% if request.url.path == '/chat' %}actief{% endif %}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v7a1 1 0 01-1 1H9l-3 3v-3H3a1 1 0 01-1-1V3z" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="1.2"/>
        </svg>
        AI Assistent
      </a>
    </nav>

    <div class="sidebar-footer">
      <a href="https://amsterdam.raadsinformatie.nl" target="_blank" class="sidebar-ext">
        raadsinformatie.nl ↗
      </a>
    </div>
  </aside>

  <!-- Hoofdpaneel -->
  <main class="app-hoofd">
    <div class="app-inhoud">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>

{% block scripts %}{% endblock %}
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
  }
</script>
</body>
</html>
